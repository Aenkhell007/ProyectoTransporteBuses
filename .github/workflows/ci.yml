name: CI Gran Continental

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  verificacion:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verificar esquema y tipos de conexion-bd
        working-directory: backend/conexion-bd
        env:
          DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/ci
        run: |
          npm ci --no-audit --no-fund
          npm run db:generate
          npm run check

      - name: Compilar y probar backend (sin mutar BD real)
        working-directory: backend
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
        run: |
          npm ci --no-audit --no-fund
          npm run check:api
          npm run build
          npm test

      - name: Compilar y probar frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm test
